services:
  pdf-signer:
    build:
      context: ./pdf-signer
      dockerfile: Dockerfile
    container_name: internship-pdf-signer
    ports:
      - "8000:8000"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: internship-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - PDF_SIGNER_URL=http://pdf-signer:8000/sign
      - GENERIC_TIMEZONE=Europe/Warsaw
      - TZ=Europe/Warsaw
    volumes:
      - n8n_data:/home/node/.n8n
      - ./email-agent:/files/email-agent
      - ./pdf-signer/test_files:/files/test_files
    depends_on:
      - pdf-signer
    restart: unless-stopped

volumes:
  n8n_data: